[project]
name = "lusiform-worker"
version = "0.1.0"
description = "Lusiform worker service"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.40.55",
    "lusiform-common",
]

[dependency-groups]
dev = [
    "boto3-stubs[sqs]==1.40.55",
    "jinja2==3.1.6",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.uv]
package = false

[tool.uv.sources]
lusiform-common = { path = "../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
