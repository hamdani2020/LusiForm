name: CI

# Runs the same Docker Compose `dev` targets used locally (see
# .kiro/steering/docker.md). No secrets are used; compose falls back to its
# local-dev defaults, and LocalStack/Postgres are not started (--no-deps).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: common (lint, type-check, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      # common/ has no image of its own; its tools come from the api dev image
      # venv (on PATH), which installs common as an editable dependency.
      - name: Build api dev image
        run: docker compose build api
      - name: Ruff lint
        run: docker compose run --rm --no-deps -w /app/common api ruff check .
      - name: Ruff format check
        run: docker compose run --rm --no-deps -w /app/common api ruff format --check .
      - name: mypy
        run: docker compose run --rm --no-deps -w /app/common api mypy .
      - name: pytest
        run: docker compose run --rm --no-deps -w /app/common api pytest -q -p no:cacheprovider

  api:
    name: api (lint, type-check, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Build api dev image
        run: docker compose build api
      - name: Ruff lint
        run: docker compose run --rm --no-deps api uv run --frozen ruff check .
      - name: Ruff format check
        run: docker compose run --rm --no-deps api uv run --frozen ruff format --check .
      - name: mypy
        run: docker compose run --rm --no-deps api uv run --frozen mypy .
      # Migration and schema tests create throwaway databases on the compose `db`.
      - name: Start Postgres
        run: docker compose up -d --wait db
      - name: pytest
        run: docker compose run --rm --no-deps api uv run --frozen pytest --ignore=tests/isolation

  worker:
    name: worker (lint, type-check, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Build worker dev image
        run: docker compose build worker
      - name: Ruff lint
        run: docker compose run --rm --no-deps worker uv run --frozen ruff check .
      - name: Ruff format check
        run: docker compose run --rm --no-deps worker uv run --frozen ruff format --check .
      - name: mypy
        run: docker compose run --rm --no-deps worker uv run --frozen mypy .
      - name: pytest
        run: docker compose run --rm --no-deps worker uv run --frozen pytest

  web:
    name: web (lint, type-check, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Build web dev image
        run: docker compose build web
      - name: Lint
        run: docker compose run --rm --no-deps web pnpm lint
      - name: Type-check
        run: docker compose run --rm --no-deps web pnpm typecheck
      - name: Unit tests
        run: docker compose run --rm --no-deps web pnpm test --run
      - name: Build
        run: docker compose run --rm --no-deps web pnpm build

  # Tenant isolation suite (foundation task 7). Its own job so a cross-partner leak is
  # visible at a glance. The api job above ignores tests/isolation to avoid running it twice.
  isolation-suite:
    name: tenant isolation suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Build api dev image
        run: docker compose build api
      # The suite creates throwaway databases on the compose `db` Postgres.
      - name: Start Postgres
        run: docker compose up -d --wait db
      - name: Isolation suite
        run: docker compose run --rm --no-deps api uv run --frozen pytest tests/isolation

  # Tenant-access lint guard (foundation task 8): fails the build when code outside
  # api/app/data/ imports the ORM models, sqlalchemy or a DB driver, or executes SQL.
  # Also runs the guard's own tests, which prove it flags a deliberate violation.
  lint-guard:
    name: tenant-access lint guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Build api dev image
        run: docker compose build api
      - name: Guard (real codebase)
        run: docker compose run --rm --no-deps api python -m tools.check_tenant_access app
      - name: Guard tests (flags a deliberate violation, codebase clean)
        run: docker compose run --rm --no-deps api uv run --frozen pytest tests/test_tenant_guard.py

  # Startup template (templates/, startup-template spec): the whole template suite runs in
  # the worker image, which carries the pinned Terraform, tflint, and Checkov. As tasks land
  # this covers schema, module validation (fmt, validate, tflint, checkov), the insecure
  # fixture, the credential scan, determinism, inventory, immutability, and the review gate.
  # Never plans or applies.
  templates:
    name: templates (schema, validation, determinism)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Build worker dev image
        run: docker compose build worker
      # The template tooling and tests are Python; lint them with the worker's rules.
      - name: Ruff lint
        run: docker compose run --rm --no-deps -w /app/templates worker uv run --frozen --project /app/worker ruff check --config /app/worker/pyproject.toml .
      - name: Ruff format check
        run: docker compose run --rm --no-deps -w /app/templates worker uv run --frozen --project /app/worker ruff format --config /app/worker/pyproject.toml --check .
      - name: mypy
        run: docker compose run --rm --no-deps -w /app/templates worker uv run --frozen --project /app/worker mypy --config-file /app/worker/pyproject.toml template_tools tests scripts
      # Review gate and frozen-version manifest for every template version (also in the suite).
      - name: Publication guards
        run: |
          for dir in templates/startup/*/; do
            docker compose run --rm --no-deps -w /app/templates worker \
              uv run --frozen --project /app/worker python -m template_tools.publication check "startup/$(basename "$dir")"
          done
      # Runs fmt, init, validate, and mocked terraform test for every module with the pinned
      # Terraform 1.10.5, plus the schema, scope, and tool-pin checks. The first run downloads
      # the AWS provider. pytest exits non-zero when it collects nothing.
      - name: Template suite
        run: templates/scripts/run-tests.sh -q

  # Platform Terraform (infra/): format, validate both environments without a backend or
  # AWS credentials, and run the module tests against a mocked AWS provider. Uses the same
  # pinned Terraform image as the worker; never plans or applies.
  infra:
    name: infra (terraform fmt, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IMAGE: hashicorp/terraform:1.10.5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # One container per directory so init and validate/test see the same providers; a
      # shared plugin cache avoids downloading the AWS provider for every directory.
      - name: Check infra
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-cache"
          tf() {
            docker run --rm --entrypoint sh \
              -v "$PWD/infra:/infra" -v "$RUNNER_TEMP/plugin-cache:/plugin-cache" \
              -e TF_PLUGIN_CACHE_DIR=/plugin-cache -e TF_IN_AUTOMATION=1 \
              -w "$1" "$TF_IMAGE" -c "$2"
          }
          tf /infra "terraform fmt -check -recursive"
          for env in staging prod; do
            tf "/infra/envs/$env" "terraform init -backend=false -input=false && terraform validate"
          done
          for dir in infra/modules/*/; do
            [ -d "$dir/tests" ] || continue
            # Fail if no test ran: a silent "0 passed" would look like a green build.
            tf "/${dir%/}" 'terraform init -backend=false -input=false >/dev/null && out=$(terraform test -no-color) || { echo "$out"; exit 1; }; echo "$out"; case "$out" in *" 0 passed, 0 failed"*) echo "no tests ran in $PWD"; exit 1;; esac'
          done
