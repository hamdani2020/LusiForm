[project]
name = "lusiform-common"
version = "0.1.0"
description = "Internal shared config and structured logging for api/ and worker/. No database access."
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
    "structlog==25.4.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.uv]
# Editable installs pick up source changes through the .pth file, so only a
# pyproject change needs a rebuild. Without this, uv treats the bind-mounted
# src/ (different inode than the image copy) as stale and rebuilds over the
# network on every `uv run` in a container.
cache-keys = [{ file = "pyproject.toml" }]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lusiform_common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
